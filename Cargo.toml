[package]
name = "rustedoutclient"
version = "0.1.0"
edition = "2021"
description = "RustedOutClient — a hardened Proxmox console client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamgell/RustedOutClient"
readme = "README.md"
keywords = ["vnc", "rfb", "remote-desktop", "viewer", "gui"]
categories = ["network-programming", "gui"]

[[bin]]
name = "rustedoutclient"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
eframe = "0.31"
egui = "0.31"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
flate2 = "1"
des = { version = "0.8", features = ["zeroize"] }
cipher = "0.4"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
byteorder = "1"
arboard = "3"
image = { version = "0.25", features = ["jpeg"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.10"
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }
getrandom = "0.4"
rand = "0.8.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
trybuild = "1"
tokio = { version = "1", features = ["test-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true
