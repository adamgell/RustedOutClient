name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assert runner architecture
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0

      - name: Install pinned supply-chain tools
        shell: bash
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.19.0 --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run all tests
        run: cargo test --all-targets --all-features --locked

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Enforce source policy
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            echo "Required source-policy matcher is unavailable"
            exit 1
          fi
          file_transfer_status=0
          file_transfer_matches="$(rg -n -i '\bsftp\b|\bscp\b' src 2>/dev/null)" || file_transfer_status=$?
          case "$file_transfer_status" in
            0)
              printf '%s\n' "$file_transfer_matches"
              echo "Disallowed file-transfer surface found in repository source"
              exit 1
              ;;
            1)
              ;;
            *)
              echo "Could not evaluate repository file-transfer source policy"
              exit 1
              ;;
          esac
          trust_status=0
          trust_matches="$(rg -n 'StrictHostKeyChecking=(no|accept-new)|UserKnownHostsFile=/dev/null' src 2>/dev/null)" || trust_status=$?
          case "$trust_status" in
            0)
              printf '%s\n' "$trust_matches"
              echo "Weakened OpenSSH trust flag found in repository source"
              exit 1
              ;;
            1)
              ;;
            *)
              echo "Could not evaluate repository SSH trust source policy"
              exit 1
              ;;
          esac

      - name: Assert target-inactive advisory packages
        shell: bash
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            echo "Required dependency-policy matcher is unavailable"
            exit 1
          fi
          graph_file="$(mktemp "${TMPDIR:-/tmp}/rustedoutclient-supported-graph.XXXXXX")" || {
            echo "Could not create the supported dependency graph file"
            exit 1
          }
          trap 'rm -f "$graph_file"' EXIT
          if ! cargo tree --locked --target aarch64-apple-darwin --all-features --format '{p}' --prefix none > "$graph_file"; then
            echo "Could not generate the supported macOS ARM64 dependency graph"
            exit 1
          fi
          matcher_status=0
          rg -q '^quick-xml v' "$graph_file" || matcher_status=$?
          case "$matcher_status" in
            0)
              echo "quick-xml unexpectedly entered the supported macOS ARM64 graph"
              exit 1
              ;;
            1)
              ;;
            *)
              echo "Could not evaluate the supported macOS ARM64 dependency policy"
              exit 1
              ;;
          esac

      - name: Audit dependencies
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: Enforce dependency policy
        run: cargo deny check --warn unmaintained

      - name: Build release binary
        run: cargo build --release --locked
