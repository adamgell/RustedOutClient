# Candidate required check pending separate operator authorization.
# This workflow's existence does not make parser-smoke merge-blocking.
# Approved pins: nightly-2026-08-29-aarch64-apple-darwin, cargo-fuzz 0.13.2.
name: Parser smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: parser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser-smoke-macos-arm64:
    name: Parser smoke macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Assert runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64

      - name: Install pinned stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0

      - name: Install fuzz toolchain and cargo-fuzz
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-08-29-aarch64-apple-darwin --profile minimal --component rustfmt,clippy
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Populate fuzz dependency cache
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path fuzz/Cargo.toml

      - name: Lint fuzz crate
        shell: bash
        run: |
          set -euo pipefail
          cargo +nightly-2026-08-29-aarch64-apple-darwin fmt --manifest-path fuzz/Cargo.toml -- --check
          RUSTFLAGS="--cfg fuzzing" cargo +nightly-2026-08-29-aarch64-apple-darwin clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

      - name: Test fuzz harness contracts
        shell: bash
        run: |
          set -euo pipefail
          RUSTFLAGS="--cfg fuzzing" CARGO_NET_OFFLINE=true cargo +nightly-2026-08-29-aarch64-apple-darwin test --manifest-path fuzz/Cargo.toml --test harness_contract --locked --offline

      - name: Parser smoke gate
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/fuzz-smoke.sh 30
